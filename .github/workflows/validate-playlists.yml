name: Validate playlists

on:
  push:
    branches:
      - main
    paths:
      - "*.m3u"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-playlists.yml"
      - "README.md"
  pull_request:
    paths:
      - "*.m3u"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/validate-playlists.yml"
      - "README.md"
  schedule:
    - cron: "30 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run validator tests
        run: python -m unittest discover -s tests -v
      - name: Validate playlists
        env:
          FAIL_ON_WARNING: ${{ github.event_name == 'schedule' }}
        run: |
          if [ "$FAIL_ON_WARNING" = "true" ]; then
            python scripts/validate_playlists.py --fail-on-warning
          else
            python scripts/validate_playlists.py
          fi
